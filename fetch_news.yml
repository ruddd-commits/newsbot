name: News Bot — Fetch Berita

on:
  schedule:
    # Setiap 30 menit (minimum interval GitHub Actions)
    - cron: "*/30 * * * *"
  workflow_dispatch:   # bisa dijalankan manual dari tab Actions

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # untuk commit seen_articles.json

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          RUN_MODE: fetch
        run: python news_bot.py

      - name: Simpan cache seen_articles
        uses: actions/upload-artifact@v4
        with:
          name: seen-articles
          path: seen_articles.json
          retention-days: 7

      - name: Commit seen_articles.json (anti-duplikat)
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add seen_articles.json || true
          git diff --cached --quiet || git commit -m "chore: update seen_articles cache [skip ci]"
          git push || true
